name: OpenWire News Render Pipeline

on:
  repository_dispatch:
    types: [process_news_request]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  render-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg & Node.js)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg nodejs

      - name: Install Python Packages
        run: |
          pip install --upgrade yt-dlp
          pip install requests edge-tts mutagen pillow g4f supabase google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Restore YouTube OAuth Credentials
        env:
          TOKEN_PICKLE_BASE64: ${{ secrets.TOKEN_PICKLE_BASE64 }}
        run: |
          echo "$TOKEN_PICKLE_BASE64" | base64 -d > token.pickle

      - name: Execute News Render Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TARGET_REQUEST_ID: ${{ github.event.client_payload.request_id }}
        run: |
          python news_worker.py
          
