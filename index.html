<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lok Press — Citizen News Desk</title>
  
  <!-- Google Fonts: Editorial Serif + Professional Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;0,900;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --news-dark: #0d1b2a;
      --news-navy: #1b263b;
      --news-gold: #c5a059;
      --news-gold-hover: #b08a42;
      --news-bg: #f4f3ef;
      --card-bg: #ffffff;
      --input-bg: #faf9f6;
      --border-color: #d1cdc7;
      --text-main: #1f2937;
      --text-muted: #4b5563;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--news-bg);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* Main Container Card */
    .container {
      width: 100%;
      max-width: 580px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 40px;
      box-shadow: 0 10px 25px rgba(13, 27, 42, 0.06);
      position: relative;
    }

    /* Formal Top News Ticker/Border Line */
    .news-header-line {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--news-dark) 0%, var(--news-gold) 50%, var(--news-dark) 100%);
      border-top-left-radius: 6px;
      border-top-right-radius: 6px;
    }

    /* Header Section */
    .header {
      text-align: center;
      margin-bottom: 32px;
      border-bottom: 2px solid var(--news-bg);
      padding-bottom: 24px;
    }

    .desk-tag {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--news-gold);
      margin-bottom: 8px;
      display: block;
    }

    .header h1 {
      font-family: 'Merriweather', serif;
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--news-dark);
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Form Layout */
    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--news-navy);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"], textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 12px 14px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: var(--news-gold);
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.15);
    }

    textarea {
      resize: vertical;
      min-height: 130px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Professional File Dropzone */
    .file-dropzone {
      border: 2px dashed var(--border-color);
      background: var(--input-bg);
      border-radius: 4px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .file-dropzone:hover {
      border-color: var(--news-gold);
      background: rgba(197, 160, 89, 0.03);
    }

    #fileLabel {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Editorial Submit Button */
    .submit-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 4px;
      background: var(--news-dark);
      color: #FFFFFF;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s ease;
      margin-top: 8px;
    }

    .submit-btn:hover {
      background: var(--news-navy);
    }

    .submit-btn:active {
      transform: translateY(1px);
    }

    /* Status Notifications */
    .status-msg {
      margin-top: 16px;
      padding: 12px;
      border-radius: 4px;
      font-size: 0.85rem;
      text-align: center;
      display: none;
      font-weight: 600;
    }

    /* Footer Desk Info */
    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .footer span {
      color: var(--news-gold);
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="news-header-line"></div>

    <div class="header">
      <span class="desk-tag">Editorial Ingestion Desk</span>
      <h1>Lok Press</h1>
      <p>Secure submission portal for verified ground reports, local incidents, and regional media.</p>
    </div>

    <!-- LOCATION INPUT -->
    <div class="form-group">
      <label for="location">Location / District</label>
      <input type="text" id="location" placeholder="e.g., Dhubri, Assam" />
    </div>

    <!-- CONTRIBUTOR NAME INPUT -->
    <div class="form-group">
      <label for="contributor">Contributor Name</label>
      <input type="text" id="contributor" placeholder="Your Name (Leave blank to remain Anonymous)" />
    </div>

    <!-- EVENT DETAIL INPUT -->
    <div class="form-group">
      <label for="event_detail">Report Details & Context</label>
      <textarea id="event_detail" placeholder="Provide factual details, timeline, or context of the event..."></textarea>
    </div>

    <!-- MEDIA FILE UPLOAD DROPZONE -->
    <div class="form-group" id="fileGroup">
      <label for="media_file">Attach Evidence (Photo / Video)</label>
      <div class="file-dropzone" onclick="document.getElementById('media_file').click()">
        <span id="fileLabel">📁 Click or drag media files to upload</span>
        <input type="file" id="media_file" accept="video/*,image/*" style="display: none;" onchange="updateFileName(this)" />
      </div>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="submitForm()">Transmit Ground Report</button>

    <div id="statusMsg" class="status-msg"></div>

    <div class="footer">
      <span>Lok Press Newsroom</span> • Verified Channels Only
    </div>
  </div>

  <script>
    function updateFileName(input) {
      const label = document.getElementById("fileLabel");
      if (input.files && input.files[0]) {
        label.innerText = "📎 File Attached: " + input.files[0].name;
        label.style.color = "var(--news-gold)";
      } else {
        label.innerText = "📁 Click or drag media files to upload";
        label.style.color = "var(--text-muted)";
      }
    }

    async function submitForm() {
      const location = document.getElementById("location").value.trim();
      let contributor = document.getElementById("contributor").value.trim();
      const eventDetail = document.getElementById("event_detail").value.trim();
      const btn = document.getElementById("submitBtn");

      if (!eventDetail) {
        showStatus("Please provide report details before submission.", "#991B1B");
        return;
      }

      if (!contributor) {
        contributor = "Anonymous";
      }

      btn.innerText = "Processing...";
      btn.disabled = true;

      let gdriveFileIds = [];

      try {
        const fileInput = document.getElementById("media_file");
        const file = fileInput.files[0];

        if (file) {
          btn.innerText = "Initializing secure transmission...";

          const urlRes = await fetch('/api/get-upload-url', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fileName: file.name, fileType: file.type })
          });

          const urlData = await urlRes.json();
          if (!urlRes.ok) throw new Error(urlData.error || "Failed to generate upload parameters.");

          btn.innerText = "Uploading media asset...";

          const uploadRes = await fetch(urlData.uploadUrl, {
            method: 'PUT',
            headers: { 'Content-Type': file.type || 'application/octet-stream' },
            body: file
          });

          if (!uploadRes.ok) throw new Error("Media upload transmission failed.");

          const driveFile = await uploadRes.json();
          if (driveFile.id) {
            gdriveFileIds.push(driveFile.id);
          }
        }

        btn.innerText = "Logging to newsroom queue...";

        const response = await fetch('/api/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            location: location || "Unspecified",
            contributor_name: contributor,
            event_detail: eventDetail,
            gdrive_file_ids: gdriveFileIds
          })
        });

        const contentType = response.headers.get("content-type");
        let result;
        if (contentType && contentType.includes("application/json")) {
          result = await response.json();
        } else {
          const rawText = await response.text();
          throw new Error(`Server Error (${response.status}): ${rawText.slice(0, 80)}...`);
        }

        if (!response.ok) throw new Error(result.error || "Submission rejected");

        showStatus("✅ Report successfully transmitted to Lok Press editorial queue.", "#166534");
        
        document.getElementById("location").value = "";
        document.getElementById("contributor").value = "";
        document.getElementById("event_detail").value = "";
        if (document.getElementById("media_file")) {
            document.getElementById("media_file").value = "";
            updateFileName(document.getElementById("media_file"));
        }

      } catch (err) {
        console.error(err);
        showStatus("❌ " + err.message, "#991B1B");
      } finally {
        btn.innerText = "Transmit Ground Report";
        btn.disabled = false;
      }
    }

    function showStatus(text, color) {
      const statusMsg = document.getElementById("statusMsg");
      statusMsg.style.display = "block";
      statusMsg.style.background = color + "12";
      statusMsg.style.color = color;
      statusMsg.style.border = `1px solid ${color}40`;
      statusMsg.innerText = text;
    }
  </script>
</body>
</html>
