<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenWire India — The People's Voice</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --saffron: #FF9933;
      --saffron-glow: rgba(255, 153, 51, 0.25);
      --green: #138808;
      --navy: #000080;
      --bg-dark: #0A0C10;
      --card-bg: #12161F;
      --input-bg: #1A202C;
      --border-color: #2D3748;
      --text-main: #F7FAFC;
      --text-muted: #A0AEC0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(255, 153, 51, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(19, 136, 8, 0.08) 0%, transparent 40%);
    }

    /* Container Card */
    .container {
      width: 100%;
      max-width: 580px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 35px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    /* Top Tricolor Accent Bar */
    .tricolor-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--saffron) 0%, #FFFFFF 50%, var(--green) 100%);
    }

    /* Header Styling */
    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-radius: 20px;
      background: rgba(255, 153, 51, 0.1);
      color: var(--saffron);
      border: 1px solid rgba(255, 153, 51, 0.3);
      margin-bottom: 12px;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(180deg, #FFFFFF 0%, #A0AEC0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    /* Form Elements */
    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select, textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    select:focus, textarea:focus {
      border-color: var(--saffron);
      box-shadow: 0 0 0 3px var(--saffron-glow);
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    /* Custom File Dropzone */
    .file-dropzone {
      border: 2px dashed var(--border-color);
      background: var(--input-bg);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .file-dropzone:hover {
      border-color: var(--saffron);
      background: rgba(255, 153, 51, 0.05);
    }

    #fileLabel {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Submit Button with Gradient Accent */
    .submit-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--saffron) 0%, var(--green) 100%);
      color: #FFFFFF;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      margin-top: 10px;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    /* Alert Message Box */
    .status-msg {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="tricolor-bar"></div>

    <div class="header">
      <span class="badge">Unbiased & Independent</span>
      <h1>OpenWire India</h1>
      <p>Leak the social bubble. Share ground realities or request investigations without bias.</p>
    </div>

    <div class="form-group">
      <label for="type">Submission Type</label>
      <select id="type" onchange="toggleFields()">
        <option value="topic">Request Video on Unspoken Topic</option>
        <option value="raw_video">Upload Raw Evidence Video</option>
      </select>
    </div>

    <div class="form-group">
      <label for="content">Description / Context</label>
      <textarea id="content" placeholder="Type the topic you want covered, or describe what is happening in your raw video evidence..."></textarea>
    </div>

    <!-- FILE UPLOAD DROPZONE CONTAINER -->
    <div class="form-group" id="fileGroup" style="display: none;">
      <label for="video_file">Upload Raw Video (MP4 / MOV)</label>
      <div class="file-dropzone" onclick="document.getElementById('video_file').click()">
        <span id="fileLabel">📁 Click or Drag & Drop Video File Here</span>
        <input type="file" id="video_file" accept="video/*" style="display: none;" onchange="updateFileName(this)" />
      </div>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="submitForm()">Submit Request</button>

    <div id="statusMsg" class="status-msg"></div>
  </div>

  <script>
    function toggleFields() {
      const type = document.getElementById("type").value;
      const fileGroup = document.getElementById("fileGroup");
      if (fileGroup) {
        fileGroup.style.display = (type === "raw_video") ? "block" : "none";
      }
    }

    // Auto-check field visibility on load
    window.addEventListener('DOMContentLoaded', () => {
      toggleFields();
    });

    function updateFileName(input) {
      const label = document.getElementById("fileLabel");
      if (input.files && input.files[0]) {
        label.innerText = "🎥 Selected: " + input.files[0].name;
        label.style.color = "var(--saffron)";
      } else {
        label.innerText = "📁 Click or Drag & Drop Video File Here";
        label.style.color = "var(--text-muted)";
      }
    }

    async function submitForm() {
      const type = document.getElementById("type").value;
      const content = document.getElementById("content").value.trim();
      const btn = document.getElementById("submitBtn");

      if (!content) {
        showStatus("Please write a description or topic before submitting.", "#FF4949");
        return;
      }

      btn.innerText = "Processing...";
      btn.disabled = true;

      let finalVideoUrl = null;

      try {
        // STEP 1: Handle Video Upload via Presigned URL if "raw_video" is selected
        if (type === "raw_video") {
          const fileInput = document.getElementById("video_file");
          const file = fileInput.files[0];

          if (!file) {
            throw new Error("Please select a video file to upload.");
          }

          btn.innerText = "Preparing secure upload...";

          // 1A. Request signed upload URL from backend API
          const urlRes = await fetch('/api/get-upload-url', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fileName: file.name, fileType: file.type })
          });

          const urlData = await urlRes.json();
          if (!urlRes.ok) throw new Error(urlData.error || "Failed to generate upload URL.");

          btn.innerText = "Uploading video directly to storage...";

          // 1B. Upload video binary file directly to Supabase Bucket
          const uploadRes = await fetch(urlData.signedUrl, {
            method: 'PUT',
            headers: { 'Content-Type': file.type },
            body: file
          });

          if (!uploadRes.ok) throw new Error("Failed to upload video file to storage.");

          // Capture the permanent organized public URL
          finalVideoUrl = urlData.publicUrl;
        }

        btn.innerText = "Submitting request...";

        // STEP 2: Submit data to backend database via API route
        const response = await fetch('/api/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            type: type,
            content: content,
            video_url: finalVideoUrl
          })
        });

        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Submission failed");

        showStatus("✅ Your request and evidence have been queued successfully!", "var(--green)");
        
        // Reset form inputs
        document.getElementById("content").value = "";
        document.getElementById("video_file").value = "";
        updateFileName(document.getElementById("video_file"));

      } catch (err) {
        console.error(err);
        showStatus("❌ " + err.message, "#FF4949");
      } finally {
        btn.innerText = "Submit Request";
        btn.disabled = false;
      }
    }

    function showStatus(text, color) {
      const statusMsg = document.getElementById("statusMsg");
      statusMsg.style.display = "block";
      statusMsg.style.background = color + "20";
      statusMsg.style.color = color;
      statusMsg.style.border = `1px solid ${color}`;
      statusMsg.innerText = text;
    }
  </script>
</body>
</html>
