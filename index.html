<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lok Press — Citizen News Desk</title>
  
  <!-- Google Fonts: Editorial Serif + Clean Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Lok Press Serious Editorial Palette */
      --navy-deep: #081026;
      --navy-dark: #0F1C3F;
      --gold-primary: #C5A059;
      --gold-hover: #A6823B;
      --cream-bg: #F8F7F4;
      --card-bg: #FFFFFF;
      --input-bg: #FCFBFA;
      --border-color: #E2DFD7;
      --text-main: #111827;
      --text-muted: #526071;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--cream-bg);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* Video Background Container */
    .bg-video-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      overflow: hidden;
    }

    .bg-video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Dark Cream Overlay over Video for High Readability */
    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(248, 247, 244, 0.92) 0%, rgba(240, 237, 230, 0.88) 100%);
      z-index: -1;
    }

    /* Container Card */
    .container {
      width: 100%;
      max-width: 560px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 40px 36px;
      box-shadow: 0 16px 36px rgba(8, 16, 38, 0.08), 0 2px 6px rgba(0, 0, 0, 0.03);
      position: relative;
    }

    /* Top Accent Line */
    .brand-accent {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--navy-deep) 0%, var(--gold-primary) 50%, var(--navy-deep) 100%);
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }

    /* Header Styling */
    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--navy-dark);
      background: rgba(197, 160, 89, 0.15);
      border: 1px solid rgba(197, 160, 89, 0.4);
      padding: 4px 12px;
      border-radius: 4px;
      margin-bottom: 12px;
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.3rem;
      font-weight: 700;
      color: var(--navy-deep);
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Form Elements */
    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--navy-dark);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    input[type="text"], textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px 16px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: var(--gold-primary);
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.18);
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    /* Custom File Dropzone */
    .file-dropzone {
      border: 2px dashed var(--border-color);
      background: var(--input-bg);
      border-radius: 8px;
      padding: 22px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .file-dropzone:hover {
      border-color: var(--gold-primary);
      background: rgba(197, 160, 89, 0.05);
    }

    #fileLabel {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Editorial Submit Button */
    .submit-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 8px;
      background: var(--navy-deep);
      color: #FFFFFF;
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 8px;
      box-shadow: 0 4px 12px rgba(8, 16, 38, 0.15);
      border: 1px solid var(--navy-dark);
    }

    .submit-btn:hover {
      background: var(--navy-dark);
      border-color: var(--gold-primary);
      box-shadow: 0 6px 18px rgba(8, 16, 38, 0.22);
      transform: translateY(-1px);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    /* Alert Message Box */
    .status-msg {
      margin-top: 18px;
      padding: 14px;
      border-radius: 6px;
      font-size: 0.88rem;
      text-align: center;
      display: none;
      font-weight: 600;
    }

    /* Footer Branding */
    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.76rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .footer span {
      color: var(--gold-hover);
      font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- Background Video Element -->
  <div class="bg-video-container">
    <video autoplay loop muted playsinline poster="https://images.unsplash.com/photo-1544644181-1484b3fdfc62?auto=format&fit=crop&w=1920&q=80">
      <!-- Replace 'dhubri-bg.mp4' with the path to your video file in your repo -->
      <source src="/dhubri-bg.mp4" type="video/mp4" />
    </video>
  </div>
  <div class="bg-overlay"></div>

  <div class="container">
    <div class="brand-accent"></div>

    <div class="header">
      <span class="header-badge">Independent Citizen Desk</span>
      <h1>Lok Press</h1>
      <p>Submit ground reports, local incidents, and investigative media for Dhubri & Western Assam</p>
    </div>

    <!-- LOCATION INPUT -->
    <div class="form-group">
      <label for="location">Location / District</label>
      <input type="text" id="location" placeholder="e.g., Dhubri, Assam" />
    </div>

    <!-- CONTRIBUTOR NAME INPUT -->
    <div class="form-group">
      <label for="contributor">Contributor Name</label>
      <input type="text" id="contributor" placeholder="Your Name (Leave blank to remain Anonymous)" />
    </div>

    <!-- EVENT DETAIL INPUT -->
    <div class="form-group">
      <label for="event_detail">Incident / Event Details</label>
      <textarea id="event_detail" placeholder="Describe key facts, timeline, location cues, or report details..."></textarea>
    </div>

    <!-- MEDIA FILE UPLOAD DROPZONE -->
    <div class="form-group" id="fileGroup">
      <label for="media_file">Upload Raw Media (Photo / Video)</label>
      <div class="file-dropzone" onclick="document.getElementById('media_file').click()">
        <span id="fileLabel">📁 Click or Drag & Drop File Here</span>
        <input type="file" id="media_file" accept="video/*,image/*" style="display: none;" onchange="updateFileName(this)" />
      </div>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="submitForm()">Submit Ground Report</button>

    <div id="statusMsg" class="status-msg"></div>

    <div class="footer">
      <span>Lok Press Newsroom</span> • Dhubri, Assam
    </div>
  </div>

  <script>
    function updateFileName(input) {
      const label = document.getElementById("fileLabel");
      if (input.files && input.files[0]) {
        label.innerText = "🎥 File Attached: " + input.files[0].name;
        label.style.color = "var(--gold-hover)";
      } else {
        label.innerText = "📁 Click or Drag & Drop File Here";
        label.style.color = "var(--text-muted)";
      }
    }

    async function submitForm() {
      const location = document.getElementById("location").value.trim();
      let contributor = document.getElementById("contributor").value.trim();
      const eventDetail = document.getElementById("event_detail").value.trim();
      const btn = document.getElementById("submitBtn");

      if (!eventDetail) {
        showStatus("Please enter event details before submitting.", "#991B1B");
        return;
      }

      if (!contributor) {
        contributor = "Anonymous";
      }

      btn.innerText = "Processing...";
      btn.disabled = true;

      let gdriveFileIds = [];

      try {
        const fileInput = document.getElementById("media_file");
        const file = fileInput.files[0];

        if (file) {
          btn.innerText = "Preparing upload...";

          const urlRes = await fetch('/api/get-upload-url', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fileName: file.name, fileType: file.type })
          });

          const urlData = await urlRes.json();
          if (!urlRes.ok) throw new Error(urlData.error || "Failed to generate upload link.");

          btn.innerText = "Uploading media...";

          const uploadRes = await fetch(urlData.uploadUrl, {
            method: 'PUT',
            headers: { 'Content-Type': file.type || 'application/octet-stream' },
            body: file
          });

          if (!uploadRes.ok) throw new Error("Failed to upload media file.");

          const driveFile = await uploadRes.json();
          if (driveFile.id) {
            gdriveFileIds.push(driveFile.id);
          }
        }

        btn.innerText = "Saving report...";

        const response = await fetch('/api/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            location: location || "Unspecified",
            contributor_name: contributor,
            event_detail: eventDetail,
            gdrive_file_ids: gdriveFileIds
          })
        });

        const contentType = response.headers.get("content-type");
        let result;
        if (contentType && contentType.includes("application/json")) {
          result = await response.json();
        } else {
          const rawText = await response.text();
          throw new Error(`Server Error (${response.status}): ${rawText.slice(0, 80)}... Check Vercel logs.`);
        }

        if (!response.ok) throw new Error(result.error || "Submission failed");

        showStatus("✅ Ground report successfully logged with Lok Press Desk.", "#166534");
        
        document.getElementById("location").value = "";
        document.getElementById("contributor").value = "";
        document.getElementById("event_detail").value = "";
        if (document.getElementById("media_file")) {
            document.getElementById("media_file").value = "";
            updateFileName(document.getElementById("media_file"));
        }

      } catch (err) {
        console.error(err);
        showStatus("❌ " + err.message, "#991B1B");
      } finally {
        btn.innerText = "Submit Ground Report";
        btn.disabled = false;
      }
    }

    function showStatus(text, color) {
      const statusMsg = document.getElementById("statusMsg");
      statusMsg.style.display = "block";
      statusMsg.style.background = color + "15";
      statusMsg.style.color = color;
      statusMsg.style.border = `1px solid ${color}40`;
      statusMsg.innerText = text;
    }
  </script>
</body>
</html>
