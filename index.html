<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lok Press — Citizen Journalism Portal</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --saffron: #FF9933;
      --saffron-glow: rgba(255, 153, 51, 0.25);
      --green: #138808;
      --bg-dark: #0A0C10;
      --card-bg: #12161F;
      --input-bg: #1A202C;
      --border-color: #2D3748;
      --text-main: #F7FAFC;
      --text-muted: #A0AEC0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(255, 153, 51, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(19, 136, 8, 0.08) 0%, transparent 40%);
    }

    /* Container Card */
    .container {
      width: 100%;
      max-width: 580px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 35px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    /* Top Accent Bar */
    .tricolor-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--saffron) 0%, #FFFFFF 50%, var(--green) 100%);
    }

    /* Header Styling */
    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-radius: 20px;
      background: rgba(255, 153, 51, 0.1);
      color: var(--saffron);
      border: 1px solid rgba(255, 153, 51, 0.3);
      margin-bottom: 12px;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(180deg, #FFFFFF 0%, #A0AEC0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    /* Form Elements */
    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"], textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: var(--saffron);
      box-shadow: 0 0 0 3px var(--saffron-glow);
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    /* Custom File Dropzone */
    .file-dropzone {
      border: 2px dashed var(--border-color);
      background: var(--input-bg);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .file-dropzone:hover {
      border-color: var(--saffron);
      background: rgba(255, 153, 51, 0.05);
    }

    #fileLabel {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Submit Button with Gradient Accent */
    .submit-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--saffron) 0%, var(--green) 100%);
      color: #FFFFFF;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      margin-top: 10px;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    /* Alert Message Box */
    .status-msg {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="tricolor-bar"></div>

    <div class="header">
      <span class="badge">Citizen News Portal</span>
      <h1>Lok Press</h1>
      <p>Report ground realities, local incidents, or request news investigations.</p>
    </div>

    <!-- LOCATION INPUT -->
    <div class="form-group">
      <label for="location">Location / District</label>
      <input type="text" id="location" placeholder="e.g., Dhubri, Assam" />
    </div>

    <!-- CONTRIBUTOR NAME INPUT -->
    <div class="form-group">
      <label for="contributor">Contributor Name</label>
      <input type="text" id="contributor" placeholder="Your Name (Leave blank to remain Anonymous)" />
    </div>

    <!-- EVENT DETAIL INPUT -->
    <div class="form-group">
      <label for="event_detail">Incident / Event Details</label>
      <textarea id="event_detail" placeholder="Describe what happened, key facts, or context..."></textarea>
    </div>

    <!-- MEDIA FILE UPLOAD DROPZONE -->
    <div class="form-group" id="fileGroup">
      <label for="media_file">Upload Raw Evidence (Video or Photo)</label>
      <div class="file-dropzone" onclick="document.getElementById('media_file').click()">
        <span id="fileLabel">📁 Click or Drag & Drop File Here</span>
        <input type="file" id="media_file" accept="video/*,image/*" style="display: none;" onchange="updateFileName(this)" />
      </div>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="submitForm()">Submit Ground Report</button>

    <div id="statusMsg" class="status-msg"></div>
  </div>

  <script>
    function updateFileName(input) {
      const label = document.getElementById("fileLabel");
      if (input.files && input.files[0]) {
        label.innerText = "🎥 Selected: " + input.files[0].name;
        label.style.color = "var(--saffron)";
      } else {
        label.innerText = "📁 Click or Drag & Drop File Here";
        label.style.color = "var(--text-muted)";
      }
    }

    async function submitForm() {
      const location = document.getElementById("location").value.trim();
      let contributor = document.getElementById("contributor").value.trim();
      const eventDetail = document.getElementById("event_detail").value.trim();
      const btn = document.getElementById("submitBtn");

      if (!eventDetail) {
        showStatus("Please write the event details before submitting.", "#FF4949");
        return;
      }

      // Fallback to "Anonymous" if contributor field is empty
      if (!contributor) {
        contributor = "Anonymous";
      }

      btn.innerText = "Processing...";
      btn.disabled = true;

      let gdriveFileIds = [];

      try {
        const fileInput = document.getElementById("media_file");
        const file = fileInput.files[0];

        // STEP 1: Handle Direct Resumable Upload to Google Drive if media is present
        if (file) {
          btn.innerText = "Preparing secure upload...";

          // 1A. Fetch direct upload URL from backend API
          const urlRes = await fetch('/api/get-upload-url', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fileName: file.name, fileType: file.type })
          });

          const urlData = await urlRes.json();
          if (!urlRes.ok) throw new Error(urlData.error || "Failed to generate upload URL.");

          btn.innerText = "Uploading media directly to secure storage...";

          // 1B. Upload binary stream directly to Google Drive URL
          const uploadRes = await fetch(urlData.uploadUrl, {
            method: 'PUT',
            headers: { 'Content-Type': file.type || 'application/octet-stream' },
            body: file
          });

          if (!uploadRes.ok) throw new Error("Failed to upload media file.");

          const driveFile = await uploadRes.json();

          // Push the File ID into the JSON array matching jsonb schema requirement
          if (driveFile.id) {
            gdriveFileIds.push(driveFile.id);
          }
        }

        btn.innerText = "Queueing report...";

        // STEP 2: Submit structured payload to database via API
        const response = await fetch('/api/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            location: location || "Unspecified",
            contributor_name: contributor,
            event_detail: eventDetail,
            gdrive_file_ids: gdriveFileIds // Saved as jsonb array [ "drive_id_1" ]
          })
        });

        const contentType = response.headers.get("content-type");
        let result;
        if (contentType && contentType.includes("application/json")) {
          result = await response.json();
        } else {
          const rawText = await response.text();
          throw new Error(`Server Error (${response.status}): ${rawText.slice(0, 80)}... Check Vercel logs.`);
        }

        if (!response.ok) throw new Error(result.error || "Submission failed");

        showStatus("✅ Ground report queued successfully for Lok Press processing!", "var(--green)");
        
        // Reset form inputs
        document.getElementById("location").value = "";
        document.getElementById("contributor").value = "";
        document.getElementById("event_detail").value = "";
        if (document.getElementById("media_file")) {
            document.getElementById("media_file").value = "";
            updateFileName(document.getElementById("media_file"));
        }

      } catch (err) {
        console.error(err);
        showStatus("❌ " + err.message, "#FF4949");
      } finally {
        btn.innerText = "Submit Ground Report";
        btn.disabled = false;
      }
    }

    function showStatus(text, color) {
      const statusMsg = document.getElementById("statusMsg");
      statusMsg.style.display = "block";
      statusMsg.style.background = color + "20";
      statusMsg.style.color = color;
      statusMsg.style.border = `1px solid ${color}`;
      statusMsg.innerText = text;
    }
  </script>
</body>
</html>
